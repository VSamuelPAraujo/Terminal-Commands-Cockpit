<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2D3F55"/>
      <stop offset="1" stop-color="#1B2733"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="26" fill="url(#bg)"/>

  <!-- terminal window -->
  <rect x="20" y="26" width="88" height="76" rx="9" fill="#0F1620"/>
  <rect x="20" y="26" width="88" height="17" rx="9" fill="#33455C"/>
  <rect x="20" y="36" width="88" height="7" fill="#33455C"/>
  <circle cx="31" cy="34.5" r="3.2" fill="#E5806B"/>
  <circle cx="42" cy="34.5" r="3.2" fill="#E3BE6A"/>
  <circle cx="53" cy="34.5" r="3.2" fill="#7FB98A"/>

  <!-- prompt -->
  <path d="M31 56l8 7-8 7" fill="none" stroke="#6FD3A0" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- an argument being filled in -->
  <rect x="47" y="58" width="32" height="6" rx="3" fill="#4F6A88"/>

  <!-- dropdown row -->
  <rect x="31" y="75" width="48" height="8" rx="4" fill="#243243"/>
  <path d="M85 77l4 4 4-4" fill="none" stroke="#8FA6C0" stroke-width="2.6"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- toggle row, switched on -->
  <rect x="31" y="89" width="30" height="8" rx="4" fill="#243243"/>
  <rect x="70" y="87" width="24" height="12" rx="6" fill="#6FD3A0"/>
  <circle cx="88" cy="93" r="4" fill="#0F1620"/>
</svg>
